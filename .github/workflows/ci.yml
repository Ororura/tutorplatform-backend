name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ororura/tutorplatform-backend

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean build --no-daemon

  restore-drill:
    name: PostgreSQL restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell syntax checks
        run: bash -n scripts/verify-postgres-backup.sh scripts/test-postgres-restore-drill.sh

      - name: ShellCheck
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" \
            koalaman/shellcheck:v0.10.0 \
            /scripts/verify-postgres-backup.sh /scripts/test-postgres-restore-drill.sh

      - name: Disposable PostgreSQL restore integration tests
        run: ./scripts/test-postgres-restore-drill.sh

  docker:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    name: Build and scan production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    needs:
      - checks
      - restore-drill

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan production image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
          output: trivy-results.txt
          timeout: 10m
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Show Trivy findings
        if: ${{ always() && hashFiles('trivy-results.txt') != '' }}
        run: |
          docker image inspect --format 'Scanned image ID: {{.Id}}' "$IMAGE_NAME:${{ github.sha }}"
          trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --version
          cat trivy-results.txt
          {
            echo '## Production image vulnerabilities (HIGH/CRITICAL)'
            echo '```text'
            cat trivy-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
          reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_NAME:${{ github.sha }}" | awk -v repo="$IMAGE_NAME@" 'index($0, repo) == 1 {print; exit}')
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Missing published image digest'; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published commit=${{ github.sha }} repository=$IMAGE_NAME tag=${{ github.sha }} digest=$digest"
          echo "Published image: $IMAGE_NAME:${{ github.sha }}@$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/tutorplatform_deploy
          chmod 600 ~/.ssh/tutorplatform_deploy
          ssh-keygen -y -f ~/.ssh/tutorplatform_deploy > /dev/null

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/tutorplatform_deploy \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'
            set -e

            cd /opt/tutorplatform

            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -f
          EOF
      - name: Deploy Demo
        run: |
          ssh -i ~/.ssh/tutorplatform_deploy \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            cd /opt/tutorplatform-demo

            docker compose pull
            docker compose up -d

            docker image prune -f
          EOF
