server:
  port: 8080
  shutdown: graceful
  # Forwarded headers are ignored unless an operator configures a trusted proxy.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:NONE}
  servlet:
    session:
      timeout: 12h

spring:
  application:
    name: tutor-learning-platform-backend

  http:
    converters:
      preferred-json-mapper: jackson2

  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      max-file-size: ${app.material-files.max-size-bytes}B
      max-request-size: ${MATERIAL_FILES_MAX_REQUEST_SIZE:11MB}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tutor_learning}
    username: ${SPRING_DATASOURCE_USERNAME:tutor}
    password: ${SPRING_DATASOURCE_PASSWORD:tutor_dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    jdbc:
      initialize-schema: always
      platform: postgresql
      cleanup-cron: "0 */15 * * * *"

management:
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health,prometheus
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    prometheus:
      access: read-only
    metrics:
      tags:
        application: tutor-backend

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
  file-storage:
    provider: ${FILE_STORAGE_PROVIDER:LOCAL}
    directory: ${FILE_STORAGE_DIRECTORY:./var/files}
    cleanup:
      # Opt in locally first. Do not enable on VPS until restoration is tested.
      enabled: ${FILE_CLEANUP_ENABLED:false}
      interval-ms: ${FILE_CLEANUP_INTERVAL_MS:3600000}
      initial-delay-ms: ${FILE_CLEANUP_INITIAL_DELAY_MS:60000}
      grace-seconds: ${FILE_CLEANUP_GRACE_SECONDS:600}
      batch-size: ${FILE_CLEANUP_BATCH_SIZE:50}
    s3-reconciliation:
      # Read-only inventory audit. NO deletion, even if an object is older than grace-seconds.
      enabled: ${S3_RECONCILIATION_ENABLED:false}
      interval-ms: ${S3_RECONCILIATION_INTERVAL_MS:3600000}
      initial-delay-ms: ${S3_RECONCILIATION_INITIAL_DELAY_MS:60000}
      grace-seconds: ${S3_RECONCILIATION_GRACE_SECONDS:86400}
      max-pages: ${S3_RECONCILIATION_MAX_PAGES:100}
      max-log-entries: ${S3_RECONCILIATION_MAX_LOG_ENTRIES:20}
    s3:
      endpoint: ${S3_ENDPOINT:https://storage.yandexcloud.net}
      region: ${S3_REGION:ru-central1}
      bucket: ${S3_BUCKET:}
  material-files:
    max-size-bytes: ${MATERIAL_FILES_MAX_SIZE_BYTES:10485760}
    allowed-mime-types: ${MATERIAL_FILES_ALLOWED_MIME_TYPES:application/pdf,image/png,image/jpeg,text/plain,application/octet-stream,application/zip,application/x-zip-compressed,text/markdown,text/csv,application/json,text/json,text/x-python,application/x-python-code,application/x-sh,text/x-shellscript,application/javascript,text/javascript,application/typescript,text/typescript,text/tsx,video/mp2t,text/x-java-source}
  security:
    session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
    auth-rate-limit:
      login-limit: ${AUTH_RATE_LIMIT_LOGIN_LIMIT:10}
      login-window: ${AUTH_RATE_LIMIT_LOGIN_WINDOW:1m}
      registration-limit: ${AUTH_RATE_LIMIT_REGISTRATION_LIMIT:5}
      registration-window: ${AUTH_RATE_LIMIT_REGISTRATION_WINDOW:10m}
      student-invitation-limit: ${AUTH_RATE_LIMIT_STUDENT_INVITATION_LIMIT:10}
      teacher-invitation-limit: ${AUTH_RATE_LIMIT_TEACHER_INVITATION_LIMIT:10}
      invitation-window: ${AUTH_RATE_LIMIT_INVITATION_WINDOW:10m}
      max-buckets: ${AUTH_RATE_LIMIT_MAX_BUCKETS:10000}
      cleanup-interval: ${AUTH_RATE_LIMIT_CLEANUP_INTERVAL:30s}
  student-invites:
    ttl: ${STUDENT_INVITE_TTL:P7D}
    public-frontend-base-url: ${PUBLIC_FRONTEND_BASE_URL:http://localhost:3000}
  teacher-invites:
    ttl: ${TEACHER_INVITE_TTL:P7D}
    public-frontend-base-url: ${PUBLIC_FRONTEND_BASE_URL:http://localhost:3000}
  reports:
    pdf:
      presentation-zone: ${REPORT_PDF_PRESENTATION_ZONE:Europe/Moscow}
      max-input-characters: ${REPORT_PDF_MAX_INPUT_CHARACTERS:200000}
      max-output-bytes: ${REPORT_PDF_MAX_OUTPUT_BYTES:5242880}

execution:
  abuse-protection:
    max-source-code-bytes: ${EXECUTION_MAX_SOURCE_CODE_BYTES:65536}
    limit: ${EXECUTION_RATE_LIMIT:10}
    window: ${EXECUTION_RATE_WINDOW:1m}
    max-buckets: ${EXECUTION_RATE_MAX_BUCKETS:10000}
    cleanup-interval: ${EXECUTION_RATE_CLEANUP_INTERVAL:30s}
  worker:
    base-url: ${EXECUTION_WORKER_BASE_URL:http://localhost:8090}
    connect-timeout: ${EXECUTION_WORKER_CONNECT_TIMEOUT:2s}
    # Safety margin added to the task time limit; total wait is capped at 60s.
    read-timeout: ${EXECUTION_WORKER_READ_TIMEOUT:5s}
  output:
    max-bytes: ${EXECUTION_OUTPUT_MAX_BYTES:16384}
